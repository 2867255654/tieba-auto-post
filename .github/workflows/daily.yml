# 贴吧游戏资讯每日摘抄 —— 云端定时运行
# 触发：每天定时（北京时间 10:00 / UTC 02:00）+ 手动 workflow_dispatch
# 安全：默认草稿模式（POST_MODE 未开），敏感项（BDUSS / LLM key）走加密 Secrets，绝不进仓库。
#       LLM（梗式润色）默认接 智谱 GLM-4-Flash（免费模型）：在 Secrets 设 LLM_API_KEY=智谱 API Key 即可。
#       （GitHub Models 免费端点 models.github.ai 于 2026-10 实测已不可用：只返回纯文本 "OK"，故弃用。）
#       要真发帖，需在 Secrets 设 POST_MODE=1 及 BDUSS 等登录态；并在 Variables 设 FORUM_NAMES。

name: 贴吧游戏资讯每日摘抄

on:
  schedule:
    - cron: '0 2 * * *'   # 北京时间 10:00（UTC 02:00）
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行摘抄流水线
        env:
          # 普通配置项（非敏感，可用 Repository variables 覆盖，也可直接走默认值）
          FORUM_NAMES: ${{ vars.FORUM_NAMES || '抗压背锅吧' }}
          TOP_N: ${{ vars.TOP_N || '8' }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '24' }}
          # RSSHub 实例：逗号分隔、从左到右依次尝试。rsshub.app 官方实例常限流/超时，故放备选
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE || 'https://rsshub.liumingye.cn,https://rsshub.app' }}
          DELAY_SECONDS: ${{ vars.DELAY_SECONDS || '3' }}
          # LLM：默认接 智谱 GLM-4-Flash（免费模型）；可用 Variables 覆盖成别家（DeepSeek / Groq 等）
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          # 默认免费版 glm-4-flash；想要更好的文案质量可在 Variables 覆盖为 glm-4-air（约 0.5 元/百万 token）
          LLM_MODEL: ${{ vars.LLM_MODEL || 'glm-4-flash' }}
          # 敏感项（账号钥匙 / API 密钥）走加密 Secrets
          BDUSS: ${{ secrets.BDUSS }}
          # LLM 密钥：填智谱 API Key；留空则自动回退到内置兜底摘要
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 贴吧登录态补充 Cookie（本地验证发帖必需，缺一不可）
          STOKEN: ${{ secrets.STOKEN }}
          BDUSS_BFESS: ${{ secrets.BDUSS_BFESS }}
          BAIDUID: ${{ secrets.BAIDUID }}
          BAIDUID_BFESS: ${{ secrets.BAIDUID_BFESS }}
          # 发帖开关：默认 '0'（草稿预览）。要真发，在 Secrets 设 POST_MODE=1 并填 BDUSS 及上述 Cookie
          POST_MODE: ${{ secrets.POST_MODE || '0' }}
        run: python main.py

      - name: 上传运行产物（草稿 / 运行日志，不含任何密钥）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tieba-digest-output
          path: output/
          retention-days: 7
