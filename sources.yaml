# 游戏资讯来源配置
# type=rss    直接 RSS 地址
# type=rsshub 由 RSSHUB_BASE（可逗号分隔多个实例，自建实例置首位）+ route 拼出
#
# game_source: true  -> 该源本身是游戏垂直媒体，条目天然游戏相关。
#   作用：无论中英文，打分都给基础分，避免被「中文游戏关键词」过滤；
#   英文游戏媒体（PCGamer/GameSpot 等）靠这个标记进入候选。
#
# 跑不通的源会被自动跳过（单源超时隔离 + RSSHub 多实例兜底），不影响整体。
# 国内游戏站（3DM/游民/小黑盒/A9VG/indienova）走 RSSHub 路由，需可用实例；
# 公开实例常超时，强烈建议自建 RSSHub 并把地址放 RSSHUB_BASE 首位。

sources:
  # —— 国内（中文，直连 RSS）——
  - name: 机核 gcores
    type: rss
    url: https://www.gcores.com/rss
    game_source: true

  # —— 海外游戏媒体（英文；GitHub 海外 runner 稳定可达）——
  - name: PCGamer
    type: rss
    url: https://www.pcgamer.com/rss/
    game_source: true
  - name: GameSpot
    type: rss
    url: https://www.gamespot.com/feeds/news/
    game_source: true
  - name: Eurogamer
    type: rss
    url: https://www.eurogamer.net/feed
    game_source: true
  - name: RockPaperShotgun
    type: rss
    url: https://www.rockpapershotgun.com/feed/
    game_source: true
  - name: VG247
    type: rss
    url: https://www.vg247.com/feed
    game_source: true
  - name: PushSquare          # PlayStation 向
    type: rss
    url: https://www.pushsquare.com/feeds/latest
    game_source: true
  - name: NintendoLife        # 任天堂向
    type: rss
    url: https://www.nintendolife.com/feeds/latest
    game_source: true
  - name: PureXbox            # Xbox 向
    type: rss
    url: https://www.purexbox.com/feeds/latest
    game_source: true

  # —— 国内游戏站（走 RSSHub 路由；路由名以新版 RSSHub 为准，已实测核对）——
  - name: 游民星空
    type: rsshub
    route: /gamersky/news
    game_source: true
  - name: 3DM
    type: rsshub
    route: /3dmgame/news        # 注意：新版 RSSHub 为 /3dmgame/news，旧 /3dm/news 已失效
    game_source: true
  - name: 小黑盒
    type: rsshub
    route: /xiaoheihe/news
    game_source: true
  - name: A9VG电玩部落
    type: rsshub
    route: /a9vg/a9vg
    game_source: true
  - name: indienova独立游戏
    type: rsshub
    route: /indienova/news
    game_source: true

  # —— 暂不可用 / 待确认（保留参考，需要时取消注释）——
